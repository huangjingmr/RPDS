[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpds"
version = "0.1.0"
description = "RPDS for reliability-aware collaborative multi-DAG task offloading in vehicular fleets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["rpds*"]
